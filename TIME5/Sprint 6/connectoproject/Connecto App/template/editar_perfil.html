{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecto - Editar Perfil</title>
  <link rel="stylesheet" href="{% static 'editar_perfil.css' %}">
</head>

<body>

  <div class="topo">
    <a href="{% url 'perfil' %}" class="voltar">‹</a>
    <h1>Editar perfil</h1>
    <span class="espaco"></span>
  </div>

  <form method="post">
    {% csrf_token %}

    <div class="foto">
      <div class="avatar">LS</div>
      <a href="#" class="alterar-foto">Alterar foto</a>
    </div>

    <div class="card">
      <h2>Dados pessoais</h2>

      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" value="Lucas Silva">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" value="lucas.silva@email.com">
    </div>

    <div class="card">
      <h2>Dados acadêmicos</h2>

      <label for="matricula">Matrícula</label>
      <input type="text" id="matricula" name="matricula" value="2510335" disabled>

      <div class="lado-a-lado">
        <div class="campo-curso">
          <label for="curso">Curso</label>
          <select id="curso" name="curso">
            <option>Administração</option>
            <option selected>Ciência da Computação</option>
            <option>Design</option>
            <option>Direito</option>
            <option>Economia</option>
            <option>Engenharia de Produção</option>
            <option>Engenharia Civil</option>
          </select>
        </div>
        <div class="campo-periodo">
          <label for="periodo">Período</label>
          <select id="periodo" name="periodo">
            <option>1º</option>
            <option>2º</option>
            <option>3º</option>
            <option>4º</option>
            <option selected>5º</option>
            <option>6º</option>
            <option>7º</option>
            <option>8º</option>
            <option>9º</option>
            <option>10º</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Áreas de interesse</h2>

      <div class="areas">
        <input type="checkbox" id="a-tec" name="areas" value="tecnologia" checked>
        <label for="a-tec">Tecnologia</label>

        <input type="checkbox" id="a-dados" name="areas" value="dados">
        <label for="a-dados">Dados / BI</label>

        <input type="checkbox" id="a-fin" name="areas" value="financas">
        <label for="a-fin">Finanças</label>

        <input type="checkbox" id="a-mkt" name="areas" value="marketing">
        <label for="a-mkt">Marketing</label>

        <input type="checkbox" id="a-eng" name="areas" value="engenharia">
        <label for="a-eng">Engenharia</label>

        <input type="checkbox" id="a-design" name="areas" value="design">
        <label for="a-design">Design</label>
      </div>
    </div>

    <button type="submit" class="botao botao-salvar">Salvar alterações</button>
    <a href="{% url 'perfil' %}" class="botao botao-cancelar">Cancelar</a>

  </form>

</body>

</html>
