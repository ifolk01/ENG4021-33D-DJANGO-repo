
{% load static %}

<!-- Ícone do Connecto na aba do navegador -->
<link rel="icon" type="image/jpeg" href="{% static 'logo_icon.jpg' %}">

<!-- Configuração do tema claro e escuro -->
<script>
  (function () {
    try {
      var salvo = localStorage.getItem('connecto-tema');
      var tema = salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', tema);
    } catch (e) {}
  })();
</script>

<!-- CSS do tema -->
<link rel="stylesheet" href="{% static 'tema.css' %}">
