
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Perfil da Empresa | CONNECTO</title>

    <link rel="stylesheet" href="{% static 'perfil.css' %}">
    <link rel="stylesheet" href="{% static 'connecto_ui.css' %}">
    <link rel="stylesheet" href="{% static 'perfil_empresa.css' %}">

    {% include 'includes/tema_head.html' %}
</head>

<body class="connecto-page">
    <main class="standard-shell profile-shell perfil-empresa">
        <h1>Perfil</h1>

        <div class="identificacao">
            <h2>{{ empresa.nome }}</h2>
            <p class="curso">Perfil do empregador</p>

            <button class="botao botao-editar" type="button" disabled>
                Editar perfil
            </button>
        </div>

        <div class="dados">
            <div class="linha">
                <span class="icone">📧</span>
                <span>E-mail</span>
                <span class="valor">{{ empresa.email }}</span>
            </div>

            <div class="linha">
                <span class="icone">🏢</span>
                <span>Descrição</span>
                <span class="valor">
                    {{ empresa.descricao|default:"Nenhuma descrição cadastrada." }}
                </span>
            </div>
        </div>
    </main>
</body>
</html>
