{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecto - Cadastro</title>
  <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>

  <div class="cadastro-container">
    <div class="cadastro-topbar">
      <a href="{% url 'login' %}" class="back-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <h2>Cadastro</h2>
    </div>

    <div class="cadastro-header">
      <h1>Criar conta</h1>
      <p>Leva menos de um minuto.</p>
    </div>

    <form class="auth-form" method="POST" action="{% url 'criar_conta' %}">
      {% csrf_token %}
      
      <input type="text" name="nome" class="auth-input" placeholder="Nome completo" required>
      
      <!-- O name="username" é vital para o Django reconhecer no views.py -->
      <input type="text" name="username" class="auth-input" placeholder="Matrícula" required>
      
      <input type="text" name="curso" class="auth-input" placeholder="Curso" required>
      
      <!-- O name="password" é vital para o Django reconhecer no views.py -->
      <input type="password" name="password" class="auth-input" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required>
      
      <input type="password" name="confirmar_senha" class="auth-input" placeholder="Confirmar senha" required>

      {% if erro %}
        <p style="color: red; font-size: 14px; text-align: center; margin: 0;">{{ erro }}</p>
      {% endif %}

      <button type="submit" class="auth-button" style="margin-top: 16px;">Criar conta</button>
    </form>
  </div>

</body>
</html>
