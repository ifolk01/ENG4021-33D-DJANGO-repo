{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecto</title>
  <link rel="stylesheet" href="{% static 'styleFelipe.css' %}">
</head>
<body>

  <header class="top-header">
    <div class="logo-container">
      <img src="{% static 'logo_icon.jpg' %}" alt="Logo Connecto" class="logo">
    </div>
    <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
    </svg>
  </header>

  <div class="search-container">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" class="search-input" placeholder="Buscar vaga ou empresa...">
  </div>

  <div class="connecto-filtros">

    
    <input type="checkbox" id="f-todas" class="connecto-filtros__input" checked>
    <label for="f-todas" class="connecto-filtros__label">Todas</label>

    <input type="checkbox" id="f-agro" class="connecto-filtros__input">
    <label for="f-agro" class="connecto-filtros__label">Agronomia</label>
    
    <input type="checkbox" id="f-art" class="connecto-filtros__input">
    <label for="f-art" class="connecto-filtros__label">Artes</label>
    
    <input type="checkbox" id="f-dados" class="connecto-filtros__input">
    <label for="f-dados" class="connecto-filtros__label">Dados BI</label>
    
    <input type="checkbox" id="f-edu" class="connecto-filtros__input">
    <label for="f-edu" class="connecto-filtros__label">Educação</label>

    <input type="checkbox" id="f-financas" class="connecto-filtros__input">
    <label for="f-financas" class="connecto-filtros__label">Finanças</label>

    <input type="checkbox" id="f-gastronomia" class="connecto-filtros__input">
    <label for="f-gastronomia" class="connecto-filtros__label">Gastronomia</label>

    <input type="checkbox" id="f-engenharia" class="connecto-filtros__input">
    <label for="f-engenharia" class="connecto-filtros__label">Engenharia</label>

    <input type="checkbox" id="f-logistica" class="connecto-filtros__input">
    <label for="f-logistica" class="connecto-filtros__label">Logística</label>

    <input type="checkbox" id="f-marketing" class="connecto-filtros__input">
    <label for="f-marketing" class="connecto-filtros__label">Marketing</label>

    <input type="checkbox" id="f-meio-ambiente" class="connecto-filtros__input">
    <label for="f-meio-ambiente" class="connecto-filtros__label">Meio Ambiente</label>

    <input type="checkbox" id="f-negocios" class="connecto-filtros__input">
    <label for="f-negocios" class="connecto-filtros__label">Negócios</label>

    <input type="checkbox" id="f-recursos-humanos" class="connecto-filtros__input">
    <label for="f-recursos-humanos" class="connecto-filtros__label">Recursos Humanos</label>

    <input type="checkbox" id="f-relacoes-internacionais" class="connecto-filtros__input">
    <label for="f-relacoes-internacionais" class="connecto-filtros__label">Relações Internacionais</label>

    <input type="checkbox" id="f-saude" class="connecto-filtros__input">
    <label for="f-saude" class="connecto-filtros__label">Saúde</label>

    <input type="checkbox" id="f-servico-social" class="connecto-filtros__input">
    <label for="f-servico-social" class="connecto-filtros__label">Serviço Social</label>
    
  </div>

  <h2 class="section-title">RECOMENDADAS PARA VOCÊ</h2>

  <div class="job-card">
    <div class="job-card-header">
      <div class="job-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#2a6d8c" stroke-width="2"><path d="M4 22h16M10 2v20M14 2v20M10 6h4M10 10h4M10 14h4M10 18h4M4 10h6M4 14h6M4 18h6M14 10h6M14 14h6M14 18h6M4 10v12M20 10v12"/></svg>
      </div>
      <div class="job-info">
        <h3>Estágio em DevOps / Infraestrutura</h3>
        <p>Stone</p>
      </div>
      <svg class="heart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
    </div>
    <div class="job-tags">
      <span class="tag tag-location"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> Rio de Janeiro</span>
      <span class="tag tag-model">Híbrido</span>
      <span class="tag tag-area">Tecnologia</span>
    </div>
    <div class="job-footer">
      Publicada recentemente
    </div>
  </div>

  <div class="job-card">
    <div class="job-card-header">
      <div class="job-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#2a6d8c" stroke-width="2"><path d="M4 22h16M10 2v20M14 2v20M10 6h4M10 10h4M10 14h4M10 18h4M4 10h6M4 14h6M4 18h6M14 10h6M14 14h6M14 18h6M4 10v12M20 10v12"/></svg>
      </div>
      <div class="job-info">
        <h3>Estagiário de UX/UI Design</h3>
        <p>99</p>
      </div>
      <svg class="heart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
    </div>
    <div class="job-tags">
      <span class="tag tag-location"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> São Paulo</span>
      <span class="tag tag-model">Remoto</span>
      <span class="tag tag-area">Design</span>
    </div>
    <div class="job-footer">
      Publicada recentemente
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="{% url 'home' %}" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Vagas</span>
    </a>
    <a href="#" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
      <span>Match</span>
    </a>
    <a href="{% url 'candidaturas' %}" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span>Minhas Candidaturas</span>
    </a>
    <a href="#" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      <span>Mensagens</span>
    </a>
    <a href="#" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Perfil</span>
    </a>
  </nav>

</body>
</html>
